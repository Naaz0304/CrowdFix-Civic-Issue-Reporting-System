version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: crowdfix-db
    environment:
      POSTGRES_DB: crowdfix_db
      POSTGRES_USER: crowdfix
      POSTGRES_PASSWORD: crowdfix_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crowdfix -d crowdfix_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crowdfix-api
    environment:
      DATABASE_URL: "postgresql://crowdfix:crowdfix_secret@postgres:5432/crowdfix_db?schema=public"
      JWT_ACCESS_SECRET: "crowdfix_access_secret_key_change_in_production_2024"
      JWT_REFRESH_SECRET: "crowdfix_refresh_secret_key_change_in_production_2024"
      JWT_ACCESS_EXPIRES_IN: "15m"
      JWT_REFRESH_EXPIRES_IN: "7d"
      PORT: "5000"
      NODE_ENV: "production"
      FRONTEND_URL: "http://localhost:3000"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  postgres_data:
